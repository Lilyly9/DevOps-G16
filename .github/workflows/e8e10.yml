name: E8-E10 teaching validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lab:
    name: e8e10-quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build teaching environment
        run: docker build -f labs/e8e10/environment/services/buildchecker/Dockerfile -t course-e8e10:ci labs/e8e10/environment
      - name: Validate both tracks
        shell: bash
        env:
          STUDENT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p work
          printf '%s\n' "$STUDENT_SOURCE_SHA" > work/student-source-commit.txt
          git rev-parse HEAD > work/checkout-commit.txt
          docker image inspect course-e8e10:ci --format '{{.Id}}' > work/environment-image-id.txt
          docker run --rm --network none course-e8e10:ci cat /opt/toolchain.lock > work/toolchain.lock
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/course" -w /course course-e8e10:ci python3 -m unittest discover -s labs/e8e10 -p 'test_*.py' -v 2>&1 | tee work/unit-tests.log
          for track in A B; do
            for stage in e8 e9 e10; do
              docker run --rm --network none --cap-add SYS_PTRACE --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/course" -w /course course-e8e10:ci python3 labs/e8e10/lab.py "$stage" --track "$track" --out "/course/work/$track-$stage"
            done
          done
      - name: Validate A3 independent configuration scenario
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/A3-extension
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/course" -w /course course-e8e10:ci python3 labs/e8e10/student_241880464.py /course/work/A3-extension 2>&1 | tee work/A3-extension.log
      - name: Validate personal E8 and E9 extensions
        shell: bash
        run: |
          set -euo pipefail
          for stage in e8 e9; do
            mkdir -p "work/A3-$stage-extension"
            docker run --rm --network none --cap-add SYS_PTRACE --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/course" -w /course course-e8e10:ci python3 labs/e8e10/student_241880464_followup.py "$stage" "/course/work/A3-$stage-extension" 2>&1 | tee "work/A3-$stage-extension.log"
          done
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: e8e10-evidence-${{ github.run_id }}
          path: work/
          retention-days: 14
