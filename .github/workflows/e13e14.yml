name: E13-E14 integration gate

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    name: e13e14-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python and interface contracts
      - name: Compile and unit tests
        run: |
          set -euo pipefail
          python3 -m py_compile labs/e11e12/pipeline.py labs/e13e14/*.py
          python3 -m unittest discover -s labs/e11e12 -p 'test_contract.py' -v
          python3 -m unittest discover -s labs/e13e14 -p 'test_*.py' -v
      - name: Compose and source scan
        run: |
          set -euo pipefail
          E14_ROOT="$PWD" E14_IMAGE=course-e11e12:999999999 docker compose -f labs/e13e14/compose.yaml config --quiet
          python3 labs/e11e12/environment/scripts/secret_scan.py . --history

  four-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
      - name: Compose schema and source secret scan
        run: |
          set -euo pipefail
          E14_ROOT="$PWD" E14_IMAGE=course-e11e12:999999999 \
            docker compose -f labs/e13e14/compose.yaml config --quiet
          python3 labs/e11e12/environment/scripts/secret_scan.py . --history

  four-services:
    name: e13e14-four-services
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build pinned teaching image
        run: |
          set -euo pipefail
      - name: Build pinned teaching image and fixture
        run: |
          set -euo pipefail
          mkdir -p work
          git config --local user.name 999999999
          git config --local user.email ci@example.invalid
          docker build --progress=plain \
            --build-arg BASE_IMAGE=python:3.13-slim@sha256:f82c96458eedc847b233e582eb31336f4954b39cae020b6dcf5b3ed0e5cbcd74 \
            --build-arg DOCKER_CLI_IMAGE=docker:28.5.1-cli@sha256:9190b0613792e658a7783cf14b2d5ace5941bb68ede7276922ea36ee457d76ad \
            -f labs/e11e12/environment/services/buildchecker/Dockerfile \
            -t course-e11e12:999999999 labs/e11e12/environment
          python3 run_e11e12.py prepare
      - name: Start four services and run E2E fixture
          docker image inspect course-e11e12:999999999 --format '{{.Id}}' > work/image-id.txt 2>/dev/null || true
          python3 run_e11e12.py prepare
      - name: Four containers run the five stages over HTTP
        run: |
          set -euo pipefail
          export E14_ROOT="$PWD" E14_IMAGE=course-e11e12:999999999
          docker compose -f labs/e13e14/compose.yaml -p e14-ci up -d --wait
          python3 labs/e13e14/orchestrate.py --request data/integration-sample/e12.json --out work/ci-e14
          python3 labs/e13e14/scan_runtime_logs.py work/ci-e14
          docker compose -f labs/e13e14/compose.yaml -p e14-ci logs --no-color > work/ci-e14-services.log
          python3 labs/e13e14/scan_runtime_logs.py work/ci-e14-services.log
      - name: Stop only this Compose project
        if: always()
        run: |
          E14_ROOT="$PWD" E14_IMAGE=course-e11e12:999999999 docker compose -f labs/e13e14/compose.yaml -p e14-ci down
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
          docker compose -f labs/e13e14/compose.yaml -p e14-ci ps > work/e14-services-ps.txt
          python3 labs/e13e14/orchestrate.py \
            --request data/integration-sample/e12.json --out work/ci-e14
          python3 labs/e13e14/scan_runtime_logs.py work/ci-e14
          docker compose -f labs/e13e14/compose.yaml -p e14-ci logs --no-color \
            > work/ci-e14-services.log
          python3 labs/e13e14/scan_runtime_logs.py work/ci-e14-services.log
      - name: C7 failure isolation on two separate tasks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('data/integration-sample/e11-a.json').read_text())
          r['base'] = '0' * 40
          Path('data/e13-c7-failed.json').write_text(
              json.dumps(r, ensure_ascii=False, indent=2) + '\n')
          PY
          set +e
          python3 run_e11e12.py run --request data/e13-c7-failed.json \
            --out work/ci-c7-failed > work/ci-c7-failed-console.log 2>&1
          printf 'C7_FAILED_EXIT=%s\n' "$?"
          set -e
          python3 run_e11e12.py run --request data/integration-sample/e11-a.json \
            --out work/ci-c7-success > work/ci-c7-success-console.log 2>&1
          printf 'C7_SUCCESS_EXIT=0\n'
          python3 labs/e13e14/verify_c7_isolation.py work/ci-c7-failed work/ci-c7-success \
            --out work/ci-c7-isolation.json
      - name: Stop only this Compose project
        if: always()
        run: |
          E14_ROOT="$PWD" E14_IMAGE=course-e11e12:999999999 \
            docker compose -f labs/e13e14/compose.yaml -p e14-ci down || true
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: e13e14-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/
          if-no-files-found: warn
          retention-days: 14
